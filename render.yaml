# One free same-origin web service. Enter secrets only in Render's dashboard.
services:
  - type: web
    name: study-world-planner
    runtime: node
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Public browser configuration for optional Supabase cloud login.
      # Set these in the Render dashboard (build-time); never put secret or
      # service-role keys here. See supabase/README.md.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_IMPORT_ACCESS_CODE
        sync: false
      - key: AI_IMPORT_DAILY_LIMIT
        value: '40'
