<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Study World · all island artwork</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f2ece6;
        color: #344057;
        font:
          13px/1.5 system-ui,
          sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100dvh;
        background: radial-gradient(
          ellipse at 80% 25%,
          #fff1cf 0%,
          #e8d6d7 55%,
          #d6d4e4 100%
        );
        touch-action: none;
      }
      header {
        position: fixed;
        top: 18px;
        left: 22px;
        pointer-events: none;
        max-width: 300px;
      }
      header small {
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 10px;
        color: #65745e;
      }
      h1 {
        font-size: 24px;
        letter-spacing: -0.5px;
        margin: 5px 0;
      }
      p {
        font-size: 12px;
        color: #647087;
        margin: 0;
      }
      nav {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        background: #fffdf6ec;
        border: 1px solid white;
        border-radius: 14px;
        padding: 8px;
        max-width: calc(100% - 24px);
        flex-wrap: wrap;
        justify-content: center;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      button,
      select {
        font: inherit;
        background: none;
        color: #42516c;
        border: 1px solid #e4dfd8;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid #7a8ec6;
      }
      #status {
        position: fixed;
        bottom: 18px;
        right: 18px;
        max-width: 170px;
        font-size: 10px;
        color: #667187;
        pointer-events: none;
      }
      @media (max-width: 640px) {
        header {
          left: 16px;
          top: 14px;
        }
        h1 {
          font-size: 20px;
        }
        #status {
          display: none;
        }
        nav {
          bottom: 12px;
          min-width: 280px;
        }
        .sr-only {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
        }
        button,
        select {
          padding: 7px 9px;
        }
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Interactive subject island art review"></canvas>
    <header>
      <small>Seven themes · original 3D artwork</small>
      <h1>Mathematics island</h1>
      <p>
        Drag to orbit · wheel / pinch to zoom.<br />Decoration only. Live topic
        plots belong to the app.
      </p>
    </header>
    <nav aria-label="Artwork camera">
      <label for="art-theme" class="sr-only">Subject artwork</label>
      <select id="art-theme" aria-label="Subject artwork">
        <option value="maths">Mathematics</option>
        <option value="reasoning">Reasoning</option>
        <option value="english">English</option>
        <option value="gk">General Knowledge</option>
        <option value="dsa">DSA</option>
        <option value="software">Software</option>
        <option value="generic">Custom subject</option>
      </select>
      <button data-view="front">Front</button
      ><button data-view="back">Back</button
      ><button data-view="side">Side</button
      ><button data-view="top">Above</button
      ><button id="wireframe">Wireframe</button>
    </nav>
    <span id="status">Loading the actual GLB…</span>
    <script type="module" src="./review.js"></script>
  </body>
</html>
