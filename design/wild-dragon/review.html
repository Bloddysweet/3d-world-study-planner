<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cinder — original wild dragon</title><style>body{margin:0;background:#171b24;color:#e8dfd2;font-family:system-ui}canvas{display:block}header{position:absolute;left:36px;top:28px;pointer-events:none}h1{font-weight:500;letter-spacing:.04em;margin:6px 0;font-size:32px}small{color:#a99e94;letter-spacing:.18em;font-size:10px}p{font-size:12px;color:#b3abb1;max-width:430px;line-height:1.7}footer{position:absolute;left:36px;bottom:25px;color:#b3abb1;font-size:11px}</style></head><body><header><small>STUDY WORLD · SECOND SKY COMPANION</small><h1>Cinder</h1><p>An original obsidian wyvern. Swept crown, armoured chest, ember eyes and broad ragged sails. Drag to turn · scroll to zoom.</p></header><footer>Actual animated 3D model · 16 bones · no downloaded franchise assets</footer><script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/examples/jsm/controls/OrbitControls.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor('#171b24');renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.body.append(renderer.domElement);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);camera.position.set(10,7,12);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,-.7);controls.enableDamping=true;
scene.add(new T.HemisphereLight('#c1d8ed','#6b4646',3));const key=new T.DirectionalLight('#fff0d2',5);key.position.set(4,8,6);scene.add(key);const rim=new T.DirectionalLight('#7b8cda',4);rim.position.set(-7,4,-4);scene.add(rim);
const gltf=await new GLTFLoader().loadAsync('/design/wild-dragon/models/cinder_wild_dragon_v1.glb');scene.add(gltf.scene);const mixer=new T.AnimationMixer(gltf.scene);mixer.clipAction(gltf.animations.find(c=>c.name==='Wingbeat')).play();window.dragonReview={scene,camera,mixer,model:gltf.scene};document.body.dataset.ready='true';
const clock=new T.Clock();renderer.setAnimationLoop(()=>{if(!window.freezeDragon)mixer.update(Math.min(clock.getDelta(),.05));controls.update();renderer.render(scene,camera);});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
